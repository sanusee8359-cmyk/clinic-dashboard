<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปยอดผู้เข้ารับการรักษา HDY69 & BKK69</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#6C5DD3;--blue-l:#EEEAFF;--blue-m:#8B7EE8;
  --teal:#3DBEA3;--teal-l:#E0F7F3;--teal-m:#3DBEA3;
  --amber:#FF754C;--amber-l:#FFF0EB;
  --purple:#6C5DD3;--purple-l:#EEEAFF;
  --rose:#FF5C8A;--rose-l:#FFE8F0;
  --g50:#F5F6FB;--g100:#F0F1FA;--g200:#E4E4F0;--g300:#D4D5E8;
  --g400:#B2B3C9;--g500:#808191;--g600:#6F7082;--g700:#4B4C5E;--g800:#2D2E40;--g900:#11142D;
  --sh:0 4px 20px rgba(108,93,211,.08),0 1px 4px rgba(108,93,211,.04);
  --sh2:0 8px 30px rgba(108,93,211,.14);
  --r:12px;--rs:8px;
}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:#F5F6FB;color:#11142D;font-size:14px;line-height:1.6}

/* ── HEADER ── */
.hdr{background:#fff;border-bottom:1px solid var(--g200);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh)}
.hdr h1{font-size:15px;font-weight:700;color:#11142D;letter-spacing:-.01em}
.hdr p{font-size:12px;color:var(--g500);margin-top:1px}
.hdr-badge{font-size:12px;font-weight:500;background:var(--blue-l);color:var(--blue);padding:4px 14px;border-radius:20px;font-family:inherit}

/* ── MONTH TABS ── */
.mtabs{background:#fff;border-bottom:1px solid var(--g200);padding:0 28px;display:flex;overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{padding:13px 18px;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;font-family:inherit}
.mtab:hover{color:var(--g800)}
.mtab.on{color:#6C5DD3;border-bottom-color:#6C5DD3}

/* ── MAIN ── */
.main{padding:22px 28px;max-width:1260px;margin:0 auto}
.mpanel{display:none}.mpanel.on{display:block}

/* ── VIEW TOGGLE ── */
.vtoggle{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.vtab{padding:7px 16px;font-size:12px;font-weight:500;border-radius:20px;border:1.5px solid var(--g300);background:#fff;color:var(--g600);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.vtab.on{background:#6C5DD3;color:#fff;border-color:#6C5DD3}
.view{display:none}.view.on{display:block}

/* ── KPI CARDS ── */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kcard{background:#fff;border-radius:var(--r);padding:15px 17px;border:1px solid var(--g100);border-left:3px solid var(--g300);box-shadow:var(--sh)}
.kcard.k1{border-left-color:#6C5DD3}.kcard.k2{border-left-color:#3DBEA3}.kcard.k3{border-left-color:#FF754C}.kcard.k4{border-left-color:#FF5C8A}.kcard.k5{border-left-color:#808191}
.klbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);margin-bottom:6px}
.kval{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--g900)}
.ksub{font-size:11px;color:var(--g500);margin-top:4px}

/* ── CARD ── */
.card{background:#fff;border-radius:var(--r);padding:18px 20px;border:1px solid var(--g200);box-shadow:var(--sh)}
.ct{font-size:13px;font-weight:600;color:var(--g800);margin-bottom:2px}
.cs{font-size:11px;color:var(--g500);margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin-bottom:13px}
.mb13{margin-bottom:13px}

/* ── GENDER ── */
.gpair{display:flex;gap:10px;margin-top:13px}
.gpill{flex:1;border-radius:var(--rs);padding:11px;text-align:center}
.gpill.m{background:#EEEAFF}.gpill.f{background:#FFE8F0}
.gpill .gn{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1}
.gpill.m .gn{color:#6C5DD3}.gpill.f .gn{color:#FF5C8A}
.gpill .gl{font-size:11px;color:var(--g600);margin-top:2px}

/* ── OCC ── */
.occ-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.occ-nm{font-size:12px;color:var(--g700);width:85px;text-align:right;flex-shrink:0;line-height:1.3}
.occ-tr{flex:1;height:6px;background:var(--g100);border-radius:3px;overflow:hidden}
.occ-fi{height:100%;border-radius:3px;background:#6C5DD3}
.occ-vl{font-size:12px;font-weight:500;color:var(--g800);width:22px;text-align:right}

/* ── COURSE CARDS ── */
.csum{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.cscard{background:#fff;border-radius:var(--r);padding:15px 17px;border:1px solid var(--g100);border-left:3px solid var(--g300);box-shadow:var(--sh);cursor:pointer;transition:box-shadow .15s}
.cscard:hover,.cscard.on{box-shadow:var(--sh2)}
.cscard.cs1{border-left-color:#6C5DD3}.cscard.cs2{border-left-color:#3DBEA3}.cscard.cs3{border-left-color:#FF754C}.cscard.cs4{border-left-color:#FF5C8A}.cscard.cs5{border-left-color:#F4C842}
.cscard .cv{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1}
.cscard.cs1 .cv{color:var(--blue)}.cscard.cs2 .cv{color:var(--teal)}.cscard.cs3 .cv{color:var(--amber)}.cscard.cs4 .cv{color:var(--purple)}.cscard.cs5 .cv{color:#F4C842}
.cscard .cl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);margin-bottom:6px}
.cscard .cx{font-size:11px;color:var(--g500);margin-top:4px}

/* ── WEEKLY CARDS ── */
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:16px}
.wcard{background:#fff;border-radius:var(--r);padding:15px 17px;border:1px solid var(--g100);border-top:3px solid #3DBEA3;box-shadow:var(--sh);cursor:pointer;transition:all .15s}
.wcard:hover,.wcard.on{box-shadow:var(--sh2);border-top-color:#3DBEA3}
.wcard.on{background:var(--teal-l)}
.wcard .wlbl{font-size:11px;font-weight:600;color:#6C5DD3;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.wcard .wval{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--g900);line-height:1}
.wcard .wsub{font-size:11px;color:var(--g600);margin-top:3px}
.wcard .wrev{font-size:13px;font-weight:600;color:#3DBEA3;margin-top:5px}
.week-detail{background:#fff;border-radius:var(--r);padding:17px 19px;border:1px solid var(--g100);box-shadow:var(--sh);margin-bottom:13px}
.week-detail-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}

/* ── WEEK BAR CHART ── */
.wbars-wrap{background:#fff;border-radius:var(--r);padding:17px 19px;border:1px solid var(--g100);box-shadow:var(--sh);margin-bottom:13px}

/* ── TABLE ── */
.tcard{background:#fff;border-radius:var(--r);padding:17px 19px;border:1px solid var(--g100);box-shadow:var(--sh);margin-bottom:13px}
.thdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;flex-wrap:wrap;gap:8px}
.ttl{font-size:13px;font-weight:600;color:var(--g800)}
.tbadge{font-size:11px;font-weight:500;background:var(--g100);color:var(--g600);padding:3px 10px;border-radius:20px}
.srch{padding:6px 11px;border:1px solid var(--g300);border-radius:var(--rs);font-size:12px;font-family:inherit;color:var(--g800);outline:none;background:var(--g50);width:220px;transition:border .15s}
.srch:focus{border-color:#6C5DD3;background:#fff}
.cpills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.cpill{padding:4px 12px;font-size:11px;font-weight:500;border-radius:20px;border:1.5px solid var(--g300);background:#fff;color:var(--g600);cursor:pointer;font-family:inherit;transition:all .15s}
.cpill.on.p1{background:#6C5DD3;color:#fff;border-color:#6C5DD3}
.cpill.on.p2{background:#3DBEA3;color:#fff;border-color:#3DBEA3}
.cpill.on.p3{background:#FF754C;color:#fff;border-color:#FF754C}
.cpill.on.p4{background:#FF5C8A;color:#fff;border-color:#FF5C8A}
.cpill.on.p5{background:#F4C842;color:#fff;border-color:#F4C842}
.cpill.on.pall{background:#11142D;color:#fff;border-color:#11142D}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:2px solid var(--g200);background:var(--g50)}
thead th{font-size:11px;font-weight:700;color:#6C5DD3;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;text-align:left;white-space:nowrap}
thead th:last-child{text-align:right}
tbody tr{border-bottom:1px solid var(--g50);transition:background .1s}
tbody tr:hover{background:var(--g50)}
tbody td{font-size:13px;color:var(--g700);padding:7px 10px}
tbody td:last-child{text-align:right;font-weight:500;color:#3DBEA3}
.gb{display:inline-block;font-size:10px;font-weight:500;padding:2px 6px;border-radius:10px}
.gb.m{background:#EEEAFF;color:#6C5DD3}.gb.f{background:#FFE8F0;color:#FF5C8A}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.empty{text-align:center;padding:32px;color:var(--g400);font-size:13px}

@media(max-width:900px){.kpis,.csum{grid-template-columns:1fr 1fr}.row2,.row3{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:10px 12px}.hdr,.mtabs{padding:0 12px}.srch{width:100%}}

/* ── THERAPIST CARDS ── */
.thr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:13px}
.thr-card{background:#fff;border-radius:var(--r);padding:15px 18px;border:1px solid var(--g100);box-shadow:var(--sh)}
.thr-card.ahn{border-top:3px solid #0B7A5F}.thr-card.sara{border-top:3px solid #7C3AED}
.thr-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.thr-card.ahn .thr-name{color:#0B7A5F}.thr-card.sara .thr-name{color:#7C3AED}
.thr-val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.thr-card.ahn .thr-val{color:#0B7A5F}.thr-card.sara .thr-val{color:#7C3AED}
.thr-sub{font-size:11px;color:var(--g500);margin-top:4px}
.thr-week-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.thr-week-lbl{color:var(--g600);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr-bars{display:flex;align-items:center;gap:5px}
.thr-seg{height:8px;border-radius:3px;display:inline-block;min-width:4px}
.thr-seg.a{background:#0B7A5F}.thr-seg.s{background:#7C3AED}
.thr-num{font-size:11px;font-weight:500}
.thr-num.a{color:#0B7A5F}.thr-num.s{color:#7C3AED}
.no-thr{background:var(--g50);border-radius:var(--rs);padding:14px;text-align:center;font-size:12px;color:var(--g500)}


/* ── THERAPIST ── */
.therapist-row{display:flex;gap:12px;margin-bottom:18px}
.therapist-card{flex:1;background:#fff;border-radius:var(--r);padding:15px 18px;border:1px solid var(--g100);box-shadow:var(--sh)}
.therapist-card.an{border-top:3px solid #6C5DD3}
.therapist-card.sara{border-top:3px solid #BE185D}
.therapist-card .tv{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.therapist-card.an .tv{color:#1B55B3}
.therapist-card.sara .tv{color:#BE185D}
.therapist-card .tl{font-size:12px;font-weight:500;color:var(--g500);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.therapist-card .ts{font-size:11px;color:var(--g500);margin-top:4px}
.wtherapist{display:flex;gap:10px;margin-top:8px}
.wth-pill{flex:1;border-radius:var(--rs);padding:8px 10px;text-align:center;font-size:12px}
.wth-pill.an{background:var(--blue-l);color:var(--blue)}
.wth-pill.sara{background:var(--rose-l);color:var(--rose)}
.wth-pill .wth-n{font-size:18px;font-weight:600;line-height:1;margin-bottom:2px}
.patient-type-row{display:flex;gap:10px;margin-bottom:14px}
.pt-pill{flex:1;background:var(--g50);border-radius:var(--rs);padding:10px 12px;text-align:center;border:1px solid var(--g200)}
.pt-pill .ptn{font-size:20px;font-weight:600;color:var(--g900)}
.pt-pill .ptl{font-size:11px;color:var(--g500);margin-top:2px}
</style>
</head>

BKK_MONTHS.forEach(k=>{ state[k]={view:'overview',weekIdx:0}; });

function fmt(n){return Number(n).toLocaleString('th-TH');}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function uniqueCount(patients){return new Set((patients||[]).map(p=>String(p.name||'').trim())).size;}
function dc(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
const gc='rgba(0,0,0,.05)',tc='#868E96';

/* ────── BUILD ALL PANELS ────── */
function buildAll(){
  const wrap=document.getElementById('mainWrap');
  MORDER.forEach(mk=>{ wrap.innerHTML+=buildPanel(mk); });
}

function buildPanel(mk){
  if(mk.startsWith('Bkk')) return buildBkkPanel(mk);
  const d=DATA[mk];
  return `<div class="mpanel" id="mp-${mk}">
    <div class="vtoggle">
      <button class="vtab on" onclick="switchView('${mk}','overview',this)">ภาพรวมรายเดือน</button>
      <button class="vtab" onclick="switchView('${mk}','weekly',this)">รายสัปดาห์</button>
      <button class="vtab" onclick="switchView('${mk}','course',this)">แยกประเภทคอร์ส</button>
    </div>

    <!-- VIEW 1: OVERVIEW -->
    <div class="view on" id="v-${mk}-overview">
      <div class="kpis">
        <div class="kcard k1"><div class="klbl">ผู้รับบริการ</div><div class="kval">${uniqueCount(d.all_patients)}</div><div class="ksub">คนทั้งเดือน (นับไม่ซ้ำ)</div></div>
        <div class="kcard k2"><div class="klbl">รายได้รวม</div><div class="kval">${fmt(d.total_revenue)}</div><div class="ksub">บาท · เฉลี่ย ${d.total>0?fmt(Math.round(d.total_revenue/d.total)):0} บาท/คน</div></div>
        <div class="kcard k3"><div class="klbl">อาชีพสูงสุด</div><div class="kval" style="font-size:16px;padding-top:5px">${d.top_occ}</div><div class="ksub">${d.top_occ_val} คน</div></div>
        <div class="kcard k4"><div class="klbl">สัดส่วนเพศ</div><div class="kval">${pct(d.male,d.male+d.female)}% ชาย</div><div class="ksub">${d.male} ชาย · ${d.female} หญิง</div></div>
        <div class="kcard k5"><div class="klbl">จำนวน Visit</div><div class="kval">${d.visit_total||d.total}</div><div class="ksub">ครั้งทั้งเดือน (รวมทุกครั้ง)</div></div>
      </div>
      <div class="row2">
        <div class="card">
          <div class="ct">ช่วงอายุ</div><div class="cs">สัดส่วนผู้รับบริการ</div>
          <div id="ageLeg-${mk}" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;font-size:11px;color:var(--g600)"></div>
          <div style="position:relative;height:190px"><canvas id="agePie-${mk}"></canvas></div>
        </div>
        <div class="card">
          <div class="ct">เพศ</div><div class="cs">ชาย / หญิง</div>
          <div style="position:relative;height:120px"><canvas id="genBar-${mk}"></canvas></div>
          <div class="gpair">
            <div class="gpill m"><div class="gn">${d.male}</div><div class="gl">ชาย (${pct(d.male,d.male+d.female)}%)</div></div>
            <div class="gpill f"><div class="gn">${d.female}</div><div class="gl">หญิง (${pct(d.female,d.male+d.female)}%)</div></div>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="card">
          <div class="ct">อาชีพ (Top 8)</div><div class="cs">จำนวนผู้รับบริการ</div>
          <div id="occBars-${mk}"></div>
        </div>
        <div class="card">
          <div class="ct">ยอดซื้อรายคน</div><div class="cs">เรียงตามลำดับ (สีตามประเภทคอร์ส)</div>
          <div style="position:relative;height:220px"><canvas id="indv-${mk}"></canvas></div>
        </div>
      </div>

      ${buildJunTherapistWeekly(mk)}
      ${buildJunCancelContact(mk)}
      ${tableCard(mk,'ov')}
    </div>

    <!-- VIEW 2: WEEKLY -->
    <div class="view" id="v-${mk}-weekly">
      ${buildWeeklyView(mk)}
    </div>

    <!-- VIEW 3: COURSE -->
    <div class="view" id="v-${mk}-course">
      <div class="csum">
        ${Object.entries(CT).map(([ck,cm])=>{const g=d.groups[ck];return `<div class="cscard ${cm.cls}" id="csc-${mk}-${ck}" onclick="filterCourse('${mk}','${ck}')">
          <div class="cl">${cm.label}</div><div class="cv">${g.count} <span style="font-size:13px;font-weight:400">คน</span></div>
          <div class="cx">${pct(g.count,d.total)}% · ${fmt(g.revenue)} บาท</div></div>`;}).join('')}
      </div>
      <div class="row2">
        <div class="card"><div class="ct">สัดส่วนประเภทคอร์ส</div><div class="cs">จำนวนคน</div>
          <div style="position:relative;height:230px"><canvas id="ctPie-${mk}"></canvas></div></div>
        <div class="card"><div class="ct">รายได้แยกประเภทคอร์ส</div><div class="cs">ยอดรวม (บาท)</div>
          <div style="position:relative;height:230px"><canvas id="ctBar-${mk}"></canvas></div></div>
      </div>
      ${tableCard(mk,'ct')}
    </div>
  </div>`;
}

function buildWeeklyView(mk){
  const d=DATA[mk];
  if(!d.weeks||d.weeks.length===0) return '<div class="empty">ไม่มีข้อมูลรายสัปดาห์</div>';
  
  const weekCards=d.weeks.map((w,i)=>`
    <div class="wcard" id="wcard-${mk}-${i}" onclick="selectWeek('${mk}',${i})">
      <div class="wlbl">${w.label.replace(/สรุปยอด(สัปดาห์|สัปดาห์)/,'').trim()}</div>
      <div class="wval">${w.count} <span style="font-size:13px;font-weight:400">คน</span></div>
      <div class="wsub">ยอดรวม</div>
      <div class="wrev">${fmt(w.revenue)} ฿</div>
      ${(w.an_count||w.sara_count)?`<div class="wtherapist">
        ${w.an_count?`<div class="wth-pill an"><div class="wth-n">${w.an_count}</div>MH02</div>`:''}
        ${w.sara_count?`<div class="wth-pill sara"><div class="wth-n">${w.sara_count}</div>MH03</div>`:''}
      </div>`:''}
    </div>`).join('');

  const wRows=d.weeks.map((w,i)=>{
    const trs=w.patients.map(p=>`<tr data-ws="${p.name.toLowerCase()} ${p.occ.toLowerCase()} ${p.gender}">
      <td>${p.name}</td><td>${p.date&&p.date.length>7?p.date.substring(5):p.date}</td>
      <td>${p.age}</td>
      <td><span class="gb ${p.gender==='ชาย'?'m':'f'}">${p.gender}</span></td>
      <td>${p.occ}</td>
      <td>${p.amount>0?fmt(p.amount)+' ฿':'<span style="color:var(--g400)">—</span>'}</td>
    </tr>`).join('');
    return `<div id="wdet-${mk}-${i}" style="display:none">
      <table id="wtbl-${mk}-${i}"><thead><tr>
        <th>ชื่อ-สกุล</th><th>วันที่</th><th>อายุ</th><th>เพศ</th><th>อาชีพ</th><th>ยอด (บาท)</th>
      </tr></thead><tbody>${trs}</tbody></table></div>`;
  }).join('');

  return `
    <div class="wbars-wrap mb13">
      <div class="ct" style="margin-bottom:2px">เปรียบเทียบรายสัปดาห์</div>
      <div class="cs">จำนวนคนและรายได้</div>
      <div style="position:relative;height:200px"><canvas id="wkComp-${mk}"></canvas></div>
    </div>
    <div class="week-grid">${weekCards}</div>
    <div class="week-detail" id="wdet-wrap-${mk}">
      <div class="week-detail-hdr">
        <div>
          <div class="ttl" id="wdet-title-${mk}">เลือกสัปดาห์ด้านบนเพื่อดูรายละเอียด</div>
          <div id="wdet-sub-${mk}" style="font-size:11px;color:var(--g500);margin-top:2px"></div>
        </div>
        <span class="tbadge" id="wdet-cnt-${mk}"></span>
      </div>
      <div class="srch" style="width:100%;max-width:260px;margin-bottom:11px;display:block">
        <input class="srch" type="text" placeholder="ค้นหาชื่อ อาชีพ..." oninput="filterWeek('${mk}',this)" style="width:100%">
      </div>
      <div style="overflow-x:auto" id="wdet-body-${mk}">
        ${wRows}
      </div>
    </div>`;
}

function tableCard(mk, sfx){
  const d=DATA[mk];
  const rows=d.all_patients.map(p=>{
    const cm=CT[p.type]||CT.single;
    return `<tr data-s="${p.name.toLowerCase()} ${p.occ.toLowerCase()} ${p.gender}" data-type="${p.type}">
      <td>${p.name}</td><td>${p.date&&p.date.length>7?p.date.substring(5):p.date}</td>
      <td>${p.age}</td><td><span class="gb ${p.gender==='ชาย'?'m':'f'}">${p.gender}</span></td>
      <td>${p.occ}</td>
      <td><span class="tdot" style="background:${cm.color}"></span>${cm.label}</td>
      <td>${p.amount>0?fmt(p.amount)+' ฿':'<span style="color:var(--g400)">—</span>'}</td>
    </tr>`;}).join('');
  return `<div class="tcard"><div class="thdr">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span class="ttl">รายชื่อทั้งหมด</span>
      <span class="tbadge" id="tc-${mk}-${sfx}">${d.all_patients.length} คน</span>
    </div>
    <input class="srch" type="text" placeholder="ค้นหา..." oninput="filterTbl('${mk}','${sfx}',this)">
  </div>
  <div class="cpills" id="cp-${mk}-${sfx}">
    <button class="cpill pall on" onclick="filterPill('${mk}','${sfx}','all',this)">ทั้งหมด</button>
    ${Object.entries(CT).map(([ck,cm])=>`<button class="cpill ${cm.pill}" onclick="filterPill('${mk}','${sfx}','${ck}',this)">${cm.label} (${d.groups[ck].count})</button>`).join('')}
  </div>
  <div style="overflow-x:auto"><table id="tbl-${mk}-${sfx}">
    <thead><tr><th>ชื่อ-สกุล</th><th>วันที่</th><th>อายุ</th><th>เพศ</th><th>อาชีพ</th><th>ประเภท</th><th>ยอด (บาท)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

/* ────── RENDER CHARTS ────── */
function renderOverview(mk){
  const d=DATA[mk];
  if(!d) return;
  // Guard: skip if canvas not in DOM yet
  if(!document.getElementById('agePie-'+mk)) return;
  const ageE=AGE_ORDER.filter(k=>d.age_dist[k]).map(k=>[k,d.age_dist[k]]);
  const ageC=ageE.map((_,i)=>AGE_COLORS[i%AGE_COLORS.length]);
  const legEl=document.getElementById(`ageLeg-${mk}`);
  if(legEl) legEl.innerHTML=ageE.map(([nm,v],i)=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:${ageC[i]};flex-shrink:0"></span>${nm}(${v})</span>`).join('');
  dc(`agePie-${mk}`);
  charts[`agePie-${mk}`]=new Chart(document.getElementById(`agePie-${mk}`),{
    type:'doughnut',data:{labels:ageE.map(e=>e[0]),datasets:[{data:ageE.map(e=>e[1]),backgroundColor:ageC,borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.parsed} คน`}}}}
  });
  dc(`genBar-${mk}`);
  charts[`genBar-${mk}`]=new Chart(document.getElementById(`genBar-${mk}`),{
    type:'bar',data:{labels:['ชาย','หญิง'],datasets:[{data:[d.male,d.female],backgroundColor:['#6C5DD3','#FF5C8A'],borderRadius:5,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.parsed.x} คน`}}},scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:11}}},y:{grid:{display:false},ticks:{color:'#495057',font:{size:12}}}}}
  });
  const occEl=document.getElementById(`occBars-${mk}`);
  if(occEl){
    const oe=Object.entries(d.occupations),maxO=Math.max(...oe.map(e=>e[1]));
    occEl.innerHTML=oe.map(([nm,v])=>`<div class="occ-row"><div class="occ-nm">${nm}</div><div class="occ-tr"><div class="occ-fi" style="width:${Math.round(v/maxO*100)}%"></div></div><div class="occ-vl">${v}</div></div>`).join('');
  }
  const pts=d.all_patients.filter(p=>p.amount>0);
  dc(`indv-${mk}`);
  charts[`indv-${mk}`]=new Chart(document.getElementById(`indv-${mk}`),{
    type:'bar',data:{labels:pts.map((_,i)=>i+1),datasets:[{data:pts.map(p=>p.amount),backgroundColor:pts.map(p=>CT[p.type]?.color||'#4B82D4'),borderRadius:2,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${fmt(ctx.parsed.y)} ฿`}}},scales:{x:{grid:{display:false},ticks:{color:tc,font:{size:9}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}}}
  });
}

function renderWeekly(mk){
  const d=DATA[mk];
  if(!d) return;
  if(!d.weeks||!d.weeks.length) return;
  if(!document.getElementById('wkComp-'+mk)) return;
  if(!d.weeks||!d.weeks.length) return;
  const labels=d.weeks.map(w=>{
    const m=w.label.match(/[ที่]+\s*(\d)/);
    return m?'สัปดาห์ที่ '+m[1]:w.label.substring(0,12);
  });
  dc(`wkComp-${mk}`);
  charts[`wkComp-${mk}`]=new Chart(document.getElementById(`wkComp-${mk}`),{
    type:'bar',
    data:{labels,datasets:[
      {label:'จำนวนคน',data:d.weeks.map(w=>w.count),backgroundColor:WEEK_COLORS.map(c=>c+'CC'),borderRadius:4,borderWidth:0,yAxisID:'y'},
      {label:'รายได้ (บาท)',data:d.weeks.map(w=>w.revenue),type:'line',borderColor:'#B45309',borderWidth:2,pointRadius:4,pointBackgroundColor:'#B45309',fill:false,yAxisID:'y2',tension:.3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:11},padding:10,color:'#495057'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label==='จำนวนคน'?` ${ctx.parsed.y} คน`:` ${fmt(ctx.parsed.y)} ฿`}}},
      scales:{
        x:{grid:{display:false},ticks:{color:tc,font:{size:11}}},
        y:{grid:{color:gc},ticks:{color:tc,font:{size:10}},title:{display:true,text:'คน',color:tc,font:{size:10}}},
        y2:{position:'right',grid:{display:false},ticks:{color:'#B45309',font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v},title:{display:true,text:'บาท',color:'#B45309',font:{size:10}}}
      }}
  });
  // auto-select first week
  if(d.weeks.length>0) selectWeek(mk,0);
}

function renderCourse(mk){
  const d=DATA[mk];
  if(!d) return;
  if(!document.getElementById('ctPie-'+mk)) return;
  const keys=Object.keys(CT),labels=keys.map(k=>CT[k].label),counts=keys.map(k=>d.groups[k].count),revs=keys.map(k=>d.groups[k].revenue),colors=keys.map(k=>CT[k].color);
  dc(`ctPie-${mk}`);
  charts[`ctPie-${mk}`]=new Chart(document.getElementById(`ctPie-${mk}`),{
    type:'doughnut',data:{labels,datasets:[{data:counts,backgroundColor:colors,borderWidth:0,hoverOffset:5}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{font:{size:12},padding:10,color:'#495057',generateLabels:ch=>ch.data.labels.map((l,i)=>({text:`${l}  ${counts[i]} คน`,fillStyle:colors[i],strokeStyle:'transparent',index:i}))}},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.parsed} คน`}}}}
  });
  dc(`ctBar-${mk}`);
  charts[`ctBar-${mk}`]=new Chart(document.getElementById(`ctBar-${mk}`),{
    type:'bar',data:{labels,datasets:[{data:revs,backgroundColor:colors,borderRadius:5,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${fmt(ctx.parsed.y)} บาท`}}},scales:{x:{grid:{display:false},ticks:{color:tc,font:{size:12}}},y:{grid:{color:gc},ticks:{color:tc,font:{size:11},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}}}
  });
}

/* ────── INTERACTIONS ────── */
function switchMonth(mk,btn){
  document.querySelectorAll('.mtab').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.mpanel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById(`mp-${mk}`).classList.add('on');
  setTimeout(()=>renderForView(mk),50);
}

function switchView(mk,view,btn){
  if(!state[mk]) state[mk]={view:'overview',weekIdx:0};
  state[mk].view=view;
  document.querySelectorAll(`#mp-${mk} .vtab`).forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll(`#mp-${mk} .view`).forEach(v=>v.classList.remove('on'));
  document.getElementById(`v-${mk}-${view}`).classList.add('on');
  setTimeout(()=>renderForView(mk),50);
}

function renderForView(mk){
  if(!state[mk]) state[mk]={view:'overview',weekIdx:0};
  const v=state[mk].view;
  if(v==='overview') renderOverview(mk);
  else if(v==='weekly') renderWeekly(mk);
  else renderCourse(mk);
}

function selectWeek(mk,idx){
  if(!state[mk]) state[mk]={view:'overview',weekIdx:0};
  state[mk].weekIdx=idx;
  const d=DATA[mk];
  document.querySelectorAll(`#v-${mk}-weekly .wcard`).forEach(c=>c.classList.remove('on'));
  const wc=document.getElementById(`wcard-${mk}-${idx}`);
  if(wc) wc.classList.add('on');
  document.querySelectorAll(`#wdet-body-${mk}>div`).forEach(d=>d.style.display='none');
  const det=document.getElementById(`wdet-${mk}-${idx}`);
  if(det) det.style.display='';
  const w=d.weeks[idx];
  const titleEl=document.getElementById(`wdet-title-${mk}`);
  if(titleEl) titleEl.textContent=w.label;
  const subEl=document.getElementById(`wdet-sub-${mk}`);
  if(subEl) subEl.textContent=`${w.count} คน · รายได้ ${fmt(w.revenue)} บาท`;
  const cntEl=document.getElementById(`wdet-cnt-${mk}`);
  if(cntEl) cntEl.textContent=w.count+' คน';
}

function filterWeek(mk,input){
  const q=input.value.toLowerCase();
  const idx=state[mk].weekIdx;
  const tbl=document.getElementById(`wtbl-${mk}-${idx}`);
  if(!tbl) return;
  tbl.querySelectorAll('tbody tr').forEach(r=>{ r.style.display=r.dataset.ws.includes(q)?'':' none'; });
}

function filterCourse(mk,ck){
  document.querySelectorAll(`#v-${mk}-course .cscard`).forEach(c=>c.classList.remove('on'));
  const sc=document.getElementById(`csc-${mk}-${ck}`);
  if(sc) sc.classList.add('on');
  document.querySelectorAll(`#cp-${mk}-ct .cpill`).forEach(b=>b.classList.remove('on'));
  const match=[...document.querySelectorAll(`#cp-${mk}-ct .cpill`)].find(b=>b.getAttribute('onclick')?.includes(`'${ck}'`));
  if(match) match.classList.add('on');
  applyFilter(mk,'ct',ck);
}

function filterPill(mk,sfx,type,btn){
  document.querySelectorAll(`#cp-${mk}-${sfx} .cpill`).forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  applyFilter(mk,sfx,type);
  if(sfx==='ct'&&type!=='all'){
    document.querySelectorAll(`#v-${mk}-course .cscard`).forEach(c=>c.classList.remove('on'));
    const sc=document.getElementById(`csc-${mk}-${type}`);
    if(sc) sc.classList.add('on');
  }
}

function applyFilter(mk,sfx,type){
  const tbl=document.getElementById(`tbl-${mk}-${sfx}`);if(!tbl)return;
  let vis=0;
  tbl.querySelectorAll('tbody tr').forEach(r=>{
    const show=type==='all'||r.dataset.type===type;
    r.style.display=show?'':' none';if(show)vis++;
  });
  const c=document.getElementById(`tc-${mk}-${sfx}`);if(c)c.textContent=vis+' คน';
}

function filterTbl(mk,sfx,input){
  const q=input.value.toLowerCase(),tbl=document.getElementById(`tbl-${mk}-${sfx}`);if(!tbl)return;
  let vis=0;
  tbl.querySelectorAll('tbody tr').forEach(r=>{
    const show=r.dataset.s.includes(q);r.style.display=show?'':' none';if(show)vis++;
  });
  const c=document.getElementById(`tc-${mk}-${sfx}`);if(c)c.textContent=vis+' คน';
}


function buildTherapistSection(mk) {
  const d = DATA[mk];
  const t = d.therapist || {'\u0e2d\u0e31\u0e49\u0e19':0,'\u0e0b\u0e32\u0e23\u0e48\u0e32':0};
  const hasData = (t['\u0e2d\u0e31\u0e49\u0e19']||0) + (t['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0) > 0;
  if (!hasData) return '<div class="no-thr">\u0e44\u0e21\u0e48\u0e21\u0e35\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e1c\u0e39\u0e49\u0e23\u0e31\u0e01\u0e29\u0e32\u0e43\u0e19\u0e40\u0e14\u0e37\u0e2d\u0e19\u0e19\u0e35\u0e49</div>';
  const totalT = (t['\u0e2d\u0e31\u0e49\u0e19']||0) + (t['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0);
  const pA = totalT > 0 ? Math.round((t['\u0e2d\u0e31\u0e49\u0e19']||0)/totalT*100) : 0;
  const pS = totalT > 0 ? Math.round((t['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0)/totalT*100) : 0;

  let wkHtml = '';
  if (d.weeks && d.weeks.some(w => w.therapist && ((w.therapist['\u0e2d\u0e31\u0e49\u0e19']||0)+(w.therapist['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0)) > 0)) {
    wkHtml = '<div style="margin-top:12px"><div style="font-size:11px;font-weight:600;color:var(--g600);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px">\u0e23\u0e32\u0e22\u0e2a\u0e31\u0e1b\u0e14\u0e32\u0e2b\u0e4c</div>';
    d.weeks.forEach(w => {
      const wt = w.therapist || {};
      const wn = (wt['\u0e2d\u0e31\u0e49\u0e19']||0) + (wt['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0);
      if (wn === 0) return;
      const mx = 90;
      const aW = wn > 0 ? Math.max(4, Math.round((wt['\u0e2d\u0e31\u0e49\u0e19']||0)/wn*mx)) : 0;
      const sW = wn > 0 ? Math.max(4, Math.round((wt['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0)/wn*mx)) : 0;
      const lbl = w.label.replace(/\u0e2a\u0e23\u0e38\u0e1b\u0e22\u0e2d\u0e14\s*/,'').trim();
      wkHtml += `<div class="thr-week-row">
        <div class="thr-week-lbl">${lbl}</div>
        <div class="thr-bars">
          ${(wt['\u0e2d\u0e31\u0e49\u0e19']||0)>0?`<span class="thr-seg a" style="width:${aW}px"></span><span class="thr-num a">${wt['\u0e2d\u0e31\u0e49\u0e19']}</span>`:''}
          ${(wt['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0)>0?`<span class="thr-seg s" style="width:${sW}px"></span><span class="thr-num s">${wt['\u0e0b\u0e32\u0e23\u0e48\u0e32']}</span>`:''}
        </div>
      </div>`;
    });
    wkHtml += '</div>';
  }

  return `<div class="thr-grid">
    <div class="thr-card ahn"><div class="thr-name">\u0e2d\u0e31\u0e49\u0e19</div>
      <div class="thr-val">${t['\u0e2d\u0e31\u0e49\u0e19']||0} <span style="font-size:13px;font-weight:400">\u0e04\u0e19</span></div>
      <div class="thr-sub">${pA}% \u0e02\u0e2d\u0e07\u0e40\u0e14\u0e37\u0e2d\u0e19</div></div>
    <div class="thr-card sara"><div class="thr-name">\u0e0b\u0e32\u0e23\u0e48\u0e32</div>
      <div class="thr-val">${t['\u0e0b\u0e32\u0e23\u0e48\u0e32']||0} <span style="font-size:13px;font-weight:400">\u0e04\u0e19</span></div>
      <div class="thr-sub">${pS}% \u0e02\u0e2d\u0e07\u0e40\u0e14\u0e37\u0e2d\u0e19</div></div>
  </div>${wkHtml}`;
}

/* ────── JUN69 SPECIAL: Therapist × Course × Weekly ────── */
function buildJunTherapistWeekly(mk){
  const d = DATA[mk];
  if(!d || !d.has_therapist) return '';
  const weeks = d.weeks || [];

  function weekStats(w){
    return ['MH02','MH03'].map(th => {
      const pts    = w.patients.filter(p => p.therapist === th);
      const newPts = pts.filter(p => p.patient_type === 'รายใหม่');
      const oldPts = pts.filter(p => p.patient_type === 'รายเก่า');
      return {th,
        total: pts.length, newPts: newPts.length, oldPts: oldPts.length,
        new3:  newPts.filter(p=>p.type==='3').length,
        new5:  newPts.filter(p=>p.type==='5').length,
        new10: newPts.filter(p=>p.type==='10').length,
        old3:  oldPts.filter(p=>p.type==='3').length,
        old5:  oldPts.filter(p=>p.type==='5').length,
        old10: oldPts.filter(p=>p.type==='10').length,
      };
    });
  }

  function courseTag(n, color, bg, label){
    if(!n) return '';
    return `<div style="display:flex;align-items:center;justify-content:space-between;background:${bg};border-radius:6px;padding:5px 10px;margin-top:5px;font-size:12px">
      <span style="color:#555">${label}</span>
      <span style="font-weight:700;color:${color}">${n} คน</span>
    </div>`;
  }

  function therapistBlock(s){
    const isAn = s.th === 'MH02';
    const accent = isAn ? '#6C5DD3' : '#FF5C8A';
    const accentL = isAn ? '#EEEAFF' : '#FFE8F0';
    const courses = courseTag(s.new3,'#92600B','#FFF7E0','ใหม่ ซื้อ 3 ครั้ง')
                  + courseTag(s.new5,'#0B7A5F','#E8F8F4','ใหม่ ซื้อ 5 ครั้ง')
                  + courseTag(s.new10,'#B45309','#FEF3C7','ใหม่ ซื้อ 10 ครั้ง')
                  + courseTag(s.old3,'#92600B','#FFF7E0','เก่า ซื้อ 3 ครั้ง')
                  + courseTag(s.old5,'#0B7A5F','#E8F8F4','เก่า ซื้อ 5 ครั้ง')
                  + courseTag(s.old10,'#B45309','#FEF3C7','เก่า ซื้อ 10 ครั้ง');
    const noCourse = !s.new3 && !s.new5 && !s.new10 && !s.old3 && !s.old5 && !s.old10;
    return `<div style="flex:1;background:#fff;border-radius:10px;border:1.5px solid ${accentL};padding:14px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="width:10px;height:10px;border-radius:50%;background:${accent};display:inline-block;flex-shrink:0"></span>
        <span style="font-weight:700;font-size:15px;color:#11142D">${s.th}</span>
      </div>
      <!-- totals row -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        <div style="background:${accentL};border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:${accent}">${s.total}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รวม</div>
        </div>
        <div style="background:#F5F6FB;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#3DBEA3">${s.newPts}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รายใหม่</div>
        </div>
        <div style="background:#F5F6FB;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#808191">${s.oldPts}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รายเก่า</div>
        </div>
      </div>
      <!-- course tags -->
      ${noCourse
        ? `<div style="font-size:12px;color:#B2B3C9;text-align:center;padding:6px 0">ไม่มีคอร์ส 3, 5 หรือ 10 ครั้ง</div>`
        : courses}
    </div>`;
  }

  const weekBlocks = weeks.map(w => {
    const stats = weekStats(w);
    const wLabel = w.label.replace(/สรุปยอด/,'').trim();
    return `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="background:#EEEAFF;color:#6C5DD3;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px">${wLabel}</span>
        <span style="font-size:12px;color:#808191">${w.count} คน · ${fmt(w.revenue)} บาท</span>
      </div>
      <div style="display:flex;gap:12px">
        ${stats.map(s => therapistBlock(s)).join('')}
      </div>
    </div>`;
  }).join('');

  // Monthly summary
  const allPts = d.all_patients;
  const monthStats = ['MH02','MH03'].map(th => {
    const pts = allPts.filter(p => p.therapist === th);
    const np  = pts.filter(p => p.patient_type === 'รายใหม่');
    const op  = pts.filter(p => p.patient_type === 'รายเก่า');
    return {th, total:pts.length, newPts:np.length, oldPts:op.length,
      new3: np.filter(p=>p.type==='3').length,
      new5: np.filter(p=>p.type==='5').length, new10: np.filter(p=>p.type==='10').length,
      old3: op.filter(p=>p.type==='3').length,
      old5: op.filter(p=>p.type==='5').length, old10: op.filter(p=>p.type==='10').length};
  });

  return `<div class="tcard mb13">
    <div class="thdr" style="margin-bottom:18px">
      <div>
        <div class="ttl">คอร์ส 3, 5 &amp; 10 ครั้ง · แยกผู้รักษา รายสัปดาห์</div>
        <div style="font-size:11px;color:var(--g500);margin-top:2px">ผู้รักษาแต่ละคนรักษาคนไข้ใหม่/เก่าที่ซื้อคอร์ส 3, 5 หรือ 10 ครั้งกี่ราย</div>
      </div>
    </div>
    ${weekBlocks}
    <div style="border-top:1px solid var(--g200);padding-top:16px;margin-top:4px">
      <div style="font-size:12px;font-weight:700;color:#11142D;margin-bottom:12px">รวมทั้งเดือน</div>
      <div style="display:flex;gap:12px">
        ${monthStats.map(s => therapistBlock(s)).join('')}
      </div>
    </div>
  </div>`;
}

/* ────── BRANCH SWITCHING ────── */
let currentBranch = 'HDY';

function switchBranch(branch, btn){
  currentBranch = branch;
  document.querySelectorAll('.branch-btn').forEach(b => {
    if(b.id === 'branch-'+branch){
      b.style.background='#6C5DD3'; b.style.color='#fff';
      b.style.border='none'; b.style.boxShadow='0 4px 12px rgba(108,93,211,.3)';
    } else {
      b.style.background='#fff'; b.style.color='#808191';
      b.style.border='2px solid #E4E4F0'; b.style.boxShadow='none';
    }
  });

  const tabBar = document.getElementById('mtabs');
  const monthKeys = (branch === 'HDY') ? MORDER : BKK_MONTHS;
  tabBar.innerHTML = monthKeys.map((mk,idx) => {
    const lbl = (DATA[mk] ? DATA[mk].label : mk) + (branch==='BKK' ? ' (BKK)' : '');
    return `<button class="mtab${idx===0?' on':''}" onclick="switchMonth('${mk}',this)">${lbl}</button>`;
  }).join('\n      ');

  document.querySelectorAll('.mpanel').forEach(p=>p.classList.remove('on'));
  monthKeys.forEach(mk => {
    if(!document.getElementById('mp-'+mk)){
      const _tmp = document.createElement('div');
      _tmp.innerHTML = buildPanel(mk);
      document.getElementById('mainWrap').appendChild(_tmp.firstElementChild);
    }
  });
  const firstKey = monthKeys[0];
  document.getElementById('mp-'+firstKey).classList.add('on');
  setTimeout(()=>renderForView(firstKey),150);
}

  const d = DATA[mk];
  if(!d || !d.has_therapist) return '';
  const therapists = d.therapist_list || Object.keys(d.therapist_totals||{});
  if(!therapists.length) return '';
  const weeks = d.weeks || [];

  const TH_COLORS = ['#6C5DD3','#FF754C','#3DBEA3','#FF5C8A','#808191'];
  const TH_LIGHT  = ['#EEEAFF','#FFF0EB','#E0F4EE','#FFE8F0','#F0F1FA'];

  function weekStats(w){
    return therapists.map((th,ti) => {
      const pts    = w.patients.filter(p => p.therapist === th);
      const newPts = pts.filter(p => p.patient_type === 'รายใหม่');
      const oldPts = pts.filter(p => p.patient_type === 'รายเก่า');
      return {th, ti, total:pts.length, newPts:newPts.length, oldPts:oldPts.length,
        new3:newPts.filter(p=>p.type==='3').length,
        new5:newPts.filter(p=>p.type==='5').length, new10:newPts.filter(p=>p.type==='10').length,
        old3:oldPts.filter(p=>p.type==='3').length,
        old5:oldPts.filter(p=>p.type==='5').length, old10:oldPts.filter(p=>p.type==='10').length};
    });
  }

  function courseTag(n, color, bg, label){
    if(!n) return '';
    return `<div style="display:flex;align-items:center;justify-content:space-between;background:${bg};border-radius:6px;padding:5px 10px;margin-top:5px;font-size:12px">
      <span style="color:#555">${label}</span>
      <span style="font-weight:700;color:${color}">${n} คน</span>
    </div>`;
  }

  function therapistBlock(s){
    const accent = TH_COLORS[s.ti % TH_COLORS.length];
    const accentL = TH_LIGHT[s.ti % TH_LIGHT.length];
    const courses = courseTag(s.new3,'#92600B','#FFF7E0','ใหม่ ซื้อ 3 ครั้ง')
                  + courseTag(s.new5,'#0B7A5F','#E8F8F4','ใหม่ ซื้อ 5 ครั้ง')
                  + courseTag(s.new10,'#B45309','#FEF3C7','ใหม่ ซื้อ 10 ครั้ง')
                  + courseTag(s.old3,'#92600B','#FFF7E0','เก่า ซื้อ 3 ครั้ง')
                  + courseTag(s.old5,'#0B7A5F','#E8F8F4','เก่า ซื้อ 5 ครั้ง')
                  + courseTag(s.old10,'#B45309','#FEF3C7','เก่า ซื้อ 10 ครั้ง');
    const noCourse = !s.new3 && !s.new5 && !s.new10 && !s.old3 && !s.old5 && !s.old10;
    return `<div style="flex:1;background:#fff;border-radius:10px;border:1.5px solid ${accentL};padding:14px 16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="width:10px;height:10px;border-radius:50%;background:${accent};display:inline-block;flex-shrink:0"></span>
        <span style="font-weight:700;font-size:15px;color:#11142D">${s.th}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        <div style="background:${accentL};border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:${accent}">${s.total}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รวม</div>
        </div>
        <div style="background:#F5F6FB;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#3DBEA3">${s.newPts}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รายใหม่</div>
        </div>
        <div style="background:#F5F6FB;border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:#808191">${s.oldPts}</div>
          <div style="font-size:10px;color:#808191;margin-top:1px">รายเก่า</div>
        </div>
      </div>
      ${noCourse
        ? `<div style="font-size:12px;color:#B2B3C9;text-align:center;padding:6px 0">ไม่มีคอร์ส 3, 5 หรือ 10 ครั้ง</div>`
        : courses}
    </div>`;
  }

  const weekBlocks = weeks.map(w => {
    const stats = weekStats(w);
    const wLabel = w.label.replace(/สรุปยอด/,'').trim();
    return `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="background:#EEEAFF;color:#6C5DD3;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px">${wLabel}</span>
        <span style="font-size:12px;color:#808191">${w.count} คน · ${fmt(w.revenue)} บาท</span>
      </div>
      <div style="display:flex;gap:12px">
        ${stats.map(s => therapistBlock(s)).join('')}
      </div>
    </div>`;
  }).join('');

  // Monthly summary
  const monthStats = therapists.map((th,ti) => {
    const tt = (d.therapist_totals||{})[th] || {};
    return {th, ti, total:tt.total||0, newPts:tt.new||0, oldPts:tt.old||0,
            new3:tt.new3||0, new5:tt.new5||0, new10:tt.new10||0,
            old3:tt.old3||0, old5:tt.old5||0, old10:tt.old10||0};
  });

  const summaryText = monthStats.map(s => {
    const accent = TH_COLORS[s.ti % TH_COLORS.length];
    const lines = [];
    if(s.new3)  lines.push(`<span style="color:#92600B;font-weight:600">รายใหม่ซื้อ 3 ครั้ง ${s.new3} คน</span>`);
    if(s.new5)  lines.push(`<span style="color:#0B7A5F;font-weight:600">รายใหม่ซื้อ 5 ครั้ง ${s.new5} คน</span>`);
    if(s.new10) lines.push(`<span style="color:#B45309;font-weight:600">รายใหม่ซื้อ 10 ครั้ง ${s.new10} คน</span>`);
    if(s.old3)  lines.push(`<span style="color:#92600B;font-weight:600">รายเก่าซื้อ 3 ครั้ง ${s.old3} คน</span>`);
    if(s.old5)  lines.push(`<span style="color:#0B7A5F;font-weight:600">รายเก่าซื้อ 5 ครั้ง ${s.old5} คน</span>`);
    if(s.old10) lines.push(`<span style="color:#B45309;font-weight:600">รายเก่าซื้อ 10 ครั้ง ${s.old10} คน</span>`);
    const dot = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${accent};margin-right:6px;vertical-align:middle"></span>`;
    const summary = lines.length > 0 ? lines.join(' · ') : `<span style="color:var(--g400)">ไม่มีคอร์ส 3, 5 หรือ 10 ครั้ง</span>`;
    return `<div>${dot}<strong>${s.th}</strong> — ${summary}</div>`;
  }).join('');

  return `<div class="tcard mb13">
    <div class="thdr" style="margin-bottom:18px">
      <div>
        <div class="ttl">คอร์ส 3, 5 &amp; 10 ครั้ง · แยกผู้รักษา รายสัปดาห์</div>
        <div style="font-size:11px;color:var(--g500);margin-top:2px">ผู้รักษาแต่ละคนรักษาคนไข้ใหม่/เก่าที่ซื้อคอร์ส 3, 5 หรือ 10 ครั้งกี่ราย</div>
      </div>
    </div>
    ${weekBlocks}
    <div style="border-top:1px solid var(--g200);padding-top:16px;margin-top:4px">
      <div style="font-size:12px;font-weight:700;color:#11142D;margin-bottom:10px">รวมทั้งเดือน</div>
      <div style="background:var(--g50);border-radius:var(--rs);padding:12px 16px;margin-bottom:14px;font-size:13px;line-height:2">
        ${summaryText}
      </div>
      <div style="display:flex;gap:12px">
        ${monthStats.map(s => therapistBlock(s)).join('')}
      </div>
    </div>
  </div>`;
}

function buildBkkContactKpis(mk){
  const d = DATA[mk];
  if(!d) return '';
  const cancelData  = (d.cancel_data||[]).filter(r=>r.total>0);
  const contactData = d.contact_data||[];
  if(!cancelData.length && !contactData.length) return '';

  const kpiRow = `<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px">
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #FF5C8A;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">ยกเลิกรวม</div>
      <div style="font-size:26px;font-weight:700;color:#FF5C8A;line-height:1">${d.cancel_total||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #3DBEA3;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">ยกเลิกใหม่</div>
      <div style="font-size:26px;font-weight:700;color:#3DBEA3;line-height:1">${d.cancel_new||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #808191;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">ยกเลิกเก่า</div>
      <div style="font-size:26px;font-weight:700;color:#808191;line-height:1">${d.cancel_old||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #6C5DD3;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">ติดต่อรวม</div>
      <div style="font-size:26px;font-weight:700;color:#6C5DD3;line-height:1">${d.contact_total||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #FF754C;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">สอบถาม</div>
      <div style="font-size:26px;font-weight:700;color:#FF754C;line-height:1">${d.contact_ask||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:14px 16px;border:1px solid #E4E4F0;border-top:3px solid #3DBEA3;box-shadow:0 2px 8px rgba(0,0,0,.05)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#808191;margin-bottom:6px">จองคิว</div>
      <div style="font-size:26px;font-weight:700;color:#3DBEA3;line-height:1">${d.contact_book||0}</div>
      <div style="font-size:11px;color:#808191;margin-top:3px">ครั้ง</div>
    </div>
  </div>`;

  const cancelRows = cancelData.map(r=>`<tr>
    <td style="font-weight:500">${r.day}</td>
    <td style="text-align:center">${r.new>0?`<span style="background:#E0F4EE;color:#0B7A5F;padding:2px 8px;border-radius:8px;font-weight:600">${r.new}</span>`:'<span style="color:#CED4DA">—</span>'}</td>
    <td style="text-align:center">${r.old>0?`<span style="background:#FFE8F0;color:#FF5C8A;padding:2px 8px;border-radius:8px;font-weight:600">${r.old}</span>`:'<span style="color:#CED4DA">—</span>'}</td>
    <td style="text-align:center;font-weight:700;color:#FF5C8A">${r.total}</td>
  </tr>`).join('');

  const contactRows = contactData.map(r=>`<tr>
    <td style="font-weight:500">${r.day}</td>
    <td style="text-align:center">${r.ask>0?`<span style="background:#FFF0EB;color:#FF754C;padding:2px 8px;border-radius:8px;font-weight:600">${r.ask}</span>`:'<span style="color:#CED4DA">—</span>'}</td>
    <td style="text-align:center">${r.book>0?`<span style="background:#E0F4EE;color:#0B7A5F;padding:2px 8px;border-radius:8px;font-weight:600">${r.book}</span>`:'<span style="color:#CED4DA">—</span>'}</td>
    <td style="text-align:center">${r.full>0?`<span style="background:#EEEAFF;color:#6C5DD3;padding:2px 8px;border-radius:8px;font-weight:600">${r.full}</span>`:'<span style="color:#CED4DA">—</span>'}</td>
    <td style="text-align:center;font-weight:700;color:#6C5DD3">${r.total}</td>
    <td style="font-size:11px;color:#808191">${r.note||''}</td>
  </tr>`).join('');

  return `<div style="margin-bottom:14px">
    ${kpiRow}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="card">
        <div class="ct" style="margin-bottom:2px">เคสยกเลิก</div>
        <div class="cs">รายวัน แยกรายใหม่/รายเก่า</div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>วันที่</th><th style="text-align:center;color:#3DBEA3">รายใหม่</th><th style="text-align:center;color:#FF5C8A">รายเก่า</th><th style="text-align:center">รวม</th></tr></thead>
          <tbody>${cancelRows}</tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="ct" style="margin-bottom:2px">การติดต่อ</div>
        <div class="cs">สอบถาม / จองคิว / คิวเต็ม รายวัน</div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>วันที่</th><th style="text-align:center;color:#FF754C">สอบถาม</th><th style="text-align:center;color:#3DBEA3">จองคิว</th><th style="text-align:center;color:#6C5DD3">คิวเต็ม</th><th style="text-align:center">รวม</th><th>หมายเหตุ</th></tr></thead>
          <tbody>${contactRows}</tbody>
        </table></div>
      </div>
    </div>
  </div>`;
}

function buildBkkPanel(mk){
  const d = DATA[mk];
  return `<div class="mpanel" id="mp-${mk}">
    <div class="vtoggle">
      <button class="vtab on" onclick="switchView('${mk}','overview',this)">ภาพรวมรายเดือน</button>
      <button class="vtab" onclick="switchView('${mk}','weekly',this)">รายสัปดาห์</button>
      <button class="vtab" onclick="switchView('${mk}','course',this)">แยกประเภทคอร์ส</button>
    </div>

    <!-- VIEW 1: OVERVIEW -->
    <div class="view on" id="v-${mk}-overview">
      <div class="kpis">
        <div class="kcard k1"><div class="klbl">ผู้รับบริการ</div><div class="kval">${uniqueCount(d.all_patients)}</div><div class="ksub">คนทั้งเดือน (นับไม่ซ้ำ)</div></div>
        <div class="kcard k2"><div class="klbl">รายได้รวม</div><div class="kval">${fmt(d.total_revenue)}</div><div class="ksub">บาท · เฉลี่ย ${d.total>0?fmt(Math.round(d.total_revenue/d.total)):0} บาท/คน</div></div>
        <div class="kcard k3"><div class="klbl">อาชีพสูงสุด</div><div class="kval" style="font-size:16px;padding-top:5px">${d.top_occ}</div><div class="ksub">${d.top_occ_val} คน</div></div>
        <div class="kcard k4"><div class="klbl">สัดส่วนเพศ</div><div class="kval">${pct(d.male,d.male+d.female)}% ชาย</div><div class="ksub">${d.male} ชาย · ${d.female} หญิง</div></div>
        <div class="kcard k5"><div class="klbl">จำนวน Visit</div><div class="kval">${d.visit_total||d.total}</div><div class="ksub">ครั้งทั้งเดือน (รวมทุกครั้ง)</div></div>
      </div>
      <div class="row2">
        <div class="card">
          <div class="ct">ช่วงอายุ</div><div class="cs">สัดส่วนผู้รับบริการ</div>
          <div id="ageLeg-${mk}" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;font-size:11px;color:var(--g600)"></div>
          <div style="position:relative;height:190px"><canvas id="agePie-${mk}"></canvas></div>
        </div>
        <div class="card">
          <div class="ct">เพศ</div><div class="cs">ชาย / หญิง</div>
          <div style="position:relative;height:120px"><canvas id="genBar-${mk}"></canvas></div>
          <div class="gpair">
            <div class="gpill m"><div class="gn">${d.male}</div><div class="gl">ชาย (${pct(d.male,d.male+d.female)}%)</div></div>
            <div class="gpill f"><div class="gn">${d.female}</div><div class="gl">หญิง (${pct(d.female,d.male+d.female)}%)</div></div>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="card">
          <div class="ct">อาชีพ (Top 8)</div><div class="cs">จำนวนผู้รับบริการ</div>
          <div id="occBars-${mk}"></div>
        </div>
        <div class="card">
          <div class="ct">ยอดซื้อรายคน</div><div class="cs">เรียงตามลำดับ (สีตามประเภทคอร์ส)</div>
          <div style="position:relative;height:220px"><canvas id="indv-${mk}"></canvas></div>
        </div>
      </div>
      ${buildBkkTherapistWeekly(mk)}
      ${buildBkkContactKpis(mk)}
      ${tableCard(mk,'ov')}
    </div>

    <!-- VIEW 2: WEEKLY -->
    <div class="view" id="v-${mk}-weekly">
      ${buildWeeklyView(mk)}
    </div>

    <!-- VIEW 3: COURSE -->
    <div class="view" id="v-${mk}-course">
      <div class="csum">
        ${Object.entries(CT).map(([ck,cm])=>{const g=d.groups[ck];return `<div class="cscard ${cm.cls}" id="csc-${mk}-${ck}" onclick="filterCourse('${mk}','${ck}')">
          <div class="cl">${cm.label}</div><div class="cv">${g.count} <span style="font-size:13px;font-weight:400">คน</span></div>
          <div class="cx">${pct(g.count,d.total)}% · ${fmt(g.revenue)} บาท</div></div>`;}).join('')}
      </div>
      <div class="row2">
        <div class="card"><div class="ct">สัดส่วนประเภทคอร์ส</div><div class="cs">จำนวนคน</div>
          <div style="position:relative;height:230px"><canvas id="ctPie-${mk}"></canvas></div></div>
        <div class="card"><div class="ct">รายได้แยกประเภทคอร์ส</div><div class="cs">ยอดรวม (บาท)</div>
          <div style="position:relative;height:230px"><canvas id="ctBar-${mk}"></canvas></div></div>
      </div>
      ${tableCard(mk,'ct')}
    </div>
  </div>`;
}

/* ────── BKK: THERAPIST × COURSE × WEEKLY ────── */</script>
</body>
</html>
